[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "structurelab-cfs"
version = "0.0.1"
description = "Cold-formed steel member strength per AISI S100-24, LRFD (DSM and EWM)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.13,<3",
    "openpyxl>=3.1.5,<4",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.9",
    "mypy==2.3.1",
    "build==1.6.1",
]

[project.scripts]
structurelab-cfs = "cfs_design.run:main"

[tool.setuptools]
include-package-data = false

[tool.setuptools.package-data]
cfs_design = ["data/*.xlsx"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["cfs_design", "cfs_design.*"]
namespaces = false

[tool.mypy]
python_version = "3.12"
files = ["src/cfs_design"]
plugins = ["pydantic.mypy"]
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["openpyxl.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 140
include = ["src/**/*.py", "tests/**/*.py", "pyproject.toml"]

[tool.ruff.lint]
select = ["C90", "E4", "E501", "E7", "E9", "F", "I", "UP", "B"]
ignore = [
    "UP042",  # Status(str, Enum): StrEnum would change str(status)
]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["C901"]
